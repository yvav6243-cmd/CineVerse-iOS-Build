workflows:
  cineverse-sideload-ipa:
    name: CineVerse iOS arm64 IPA (Sideloadly / AltStore)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build & Verify Release arm64 CineVerse.ipa
        script: |
          sed -i '' 's/\r$//' scripts/build_ipa.sh scripts/verify_ipa.sh
          chmod +x scripts/build_ipa.sh scripts/verify_ipa.sh
          ./scripts/build_ipa.sh --sideload
    artifacts:
      - CineVerse.ipa
      - Releases/CineVerse.ipa
      - Releases/README.md
      - Releases/REBUILD_AND_SIGN.md
