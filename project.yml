name: CineVerse
options:
  bundleIdPrefix: com.cineverse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  CineVerse:
    type: application
    platform: iOS
    sources:
      - path: CineVerse
        excludes:
          - Resources/Info.plist
          - Resources/CineVerse.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(CV_BUNDLE_ID)"
        INFOPLIST_FILE: CineVerse/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CineVerse/Resources/CineVerse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: CineVerseWidgets
        embed: true

  CineVerseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CineVerseWidgets
        excludes:
          - Info.plist
          - CineVerseWidgets.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(CV_BUNDLE_ID).widgets"
        INFOPLIST_FILE: CineVerseWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: CineVerseWidgets/CineVerseWidgets.entitlements
        SKIP_INSTALL: YES

  CineVerseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CineVerseTests
        excludes:
          - Fixtures
      - path: CineVerseTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: CineVerse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(CV_BUNDLE_ID).tests"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CineVerse.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CineVerse"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  CineVerse:
    build:
      targets:
        CineVerse: all
        CineVerseWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CineVerseTests
    archive:
      config: Release
